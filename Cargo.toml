[package]
name = "ameter"
version = "0.2.0"
edition = "2024"
authors = ["younkeunho"]
description = "Taskbar meter for Codex, Claude and Higgsfield usage on Windows"
repository = "https://github.com/younkeunho/ameter"
license-file = "LICENSE"
publish = false

[[bin]]
name = "ameter"
path = "src/main.rs"

[[bin]]
name = "ameter-cli"
path = "src/bin/ameter-cli.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
# 0.59 links through import libraries, so the windows-gnu toolchain builds without dlltool.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
